server:
  port: ${USER_SERVICE_PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 8KB

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 10s
  main:
    banner-mode: "off"

library:
  session:
    idle-timeout: PT30M

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
